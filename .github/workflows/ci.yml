name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lua-tests:
    name: Lua unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -q
          sudo apt-get install -y lua5.1

      - name: Run Lua test suites
        run: lua5.1 tests/run_all.lua

  luacheck:
    name: Luacheck static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Luacheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck

      - name: Lint addon source
        run: luacheck EnhancedCombatForever/

  toc-validate:
    name: TOC file integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check all TOC-listed files exist
        run: |
          TOC="EnhancedCombatForever/EnhancedCombatForever.toc"
          MISSING=0
          while IFS= read -r line; do
            # Skip comments and metadata lines
            [[ "$line" =~ ^## ]] && continue
            [[ -z "${line// }" ]] && continue
            FILE="EnhancedCombatForever/$line"
            if [ ! -f "$FILE" ]; then
              echo "MISSING: $FILE"
              MISSING=1
            else
              echo "OK: $FILE"
            fi
          done < "$TOC"
          exit $MISSING

  node-tests:
    name: Deploy script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run deploy tests
        run: npm test

  code-review:
    name: Claude code review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [lua-tests, luacheck, toc-validate, node-tests]
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);

      - name: Exchange for Anthropic access token
        run: |
          ANTHROPIC_ACCESS_TOKEN=$(curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON | jq -r '.access_token'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_01CErsT8iccNm87F8r8Bp6py",
            "organization_id": "feeb679c-40c2-44ff-8ab8-f396a6938a77",
            "service_account_id": "svac_01PoGNAaUBgFhcBm46AHSJqJ",
            "workspace_id": "wrkspc_01ShSoa2cA7dYJHxaJZ3MtNN"
          }
          JSON
          )
          echo "::add-mask::$ANTHROPIC_ACCESS_TOKEN"
          echo "ANTHROPIC_ACCESS_TOKEN=$ANTHROPIC_ACCESS_TOKEN" >> $GITHUB_ENV

      - name: Install Claude Code
        run: npm install -g --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code

      - name: Run ultra code review
        env:
          ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          claude --dangerously-skip-permissions -p \
            "/code-review ultra ${{ github.event.pull_request.number }} --post"
